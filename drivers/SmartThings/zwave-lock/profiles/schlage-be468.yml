name: bp-schlage-be468
components:
- id: main
  label: Main
  capabilities:
  - id: lock
    version: 1
  - id: lockCodes
    version: 1
  - id: lockCredentials
    version: 1
  - id: lockUsers
    version: 1
  - id: heartsample19211.lockActivity
    version: 1
  - id: tamperAlert
    version: 1
  - id: battery
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: SmartLock
- id: settings
  label: Settings
  capabilities:
  - id: heartsample19211.schlageLockAlarm
    version: 1
  - id: heartsample19211.autoLock
    version: 1
  - id: heartsample19211.interiorSchlageButton
    version: 1
  - id: heartsample19211.keypadBeep
    version: 1
  - id: heartsample19211.lockAndLeave
    version: 1
  - id: heartsample19211.vacationMode
    version: 1
  - id: heartsample19211.deviceNetworkId
    version: 1
preferences:
- title: "Query lock codes on refresh"
  name: refreshCodes
  description: "For legacy lock-code devices, retrieve all lock codes when refreshed."
  required: true
  preferenceType: boolean
  definition:
    default: true
- title: "Length of user code"
  name: codeLength
  description: "User codes may be between 4 and 8 digits. Changing this setting erases all existing codes."
  required: false
  preferenceType: integer
  definition:
    minimum: 4
    maximum: 8
